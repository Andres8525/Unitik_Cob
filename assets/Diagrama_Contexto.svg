erOS, con reintentos)</text><path d="M860,960 L860,740" fill="none" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#arr)"/><text x="872.0" y="841.4" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" style="">Resultado del comando y</text><text x="872.0" y="858.6" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" style="">estado de conexión</text><path d="M1020,690 L1280,690" fill="none" stroke="#1F3A5F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1150.0" y="651.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1F3A5F" style="">Recordatorios y avisos de</text><text x="1150.0" y="668.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1F3A5F" style="">suspensión y reconexión</text><rect x="330" y="1119" width="34" height="22" rx="4" fill="#fff" stroke="#1F3A5F" stroke-width="1.8"/><text x="374.0" y="1130.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" style="">Actor o sistema en uso</text><rect x="556.72" y="1119" width="34" height="22" rx="4" fill="#fff" stroke="#1F3A5F" stroke-width="1.8" stroke-dasharray="7 5"/><text x="600.7" y="1130.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" style="">Servicio externo por integrar en la Fase 4 (Transición)</text><path d="M1006.52,1130 L1046.52,1130" fill="none" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#arr)"/><text x="1056.5" y="1130.0" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" style="">Flujo de información</text></svg>